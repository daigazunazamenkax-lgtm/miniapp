<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mini App</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#0b0d14; --text:#f4f6ff; --muted:rgba(244,246,255,.58);
  --glass:rgba(255,255,255,.08); --edge:rgba(255,255,255,.16); --hi:rgba(255,255,255,.28);
  --accent:#7aa2ff; --accent2:#c58bff; --ok:#6ee7b7; --err:#ff8a9b;
  --b1:#3b5bff; --b2:#a23bff; --b3:#00c2a8;
}
@media (prefers-color-scheme:light){:root{
  --bg:#eef1fb; --text:#12162b; --muted:rgba(18,22,43,.58);
  --glass:rgba(255,255,255,.55); --edge:rgba(255,255,255,.8); --hi:rgba(255,255,255,.95);
  --accent:#3b5bff; --accent2:#9b3bff; --ok:#0e9f6e; --err:#e0364f;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font:16px/1.4 -apple-system,"SF Pro Display",Inter,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.blob{position:fixed;width:60vmax;height:60vmax;border-radius:50%;filter:blur(70px);opacity:.5;z-index:0;pointer-events:none}
.blob.a{background:var(--b1);top:-25vmax;left:-20vmax}
.blob.b{background:var(--b2);bottom:-25vmax;right:-20vmax}
.blob.c{background:var(--b3);width:35vmax;height:35vmax;top:40%;left:55%;opacity:.28}
main{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 104px)}
.glass{background:var(--glass);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);
  border:1px solid var(--edge);border-radius:24px;box-shadow:inset 0 1px 0 var(--hi),0 10px 30px rgba(0,0,0,.18)}
.card{padding:18px;margin-bottom:12px}
h1{font-size:28px;margin:6px 4px 16px;letter-spacing:-.02em}
h2{font-size:13px;margin:20px 6px 10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.hero{padding:22px}
.hero small{color:var(--muted)}
.hero .big{font-size:44px;font-weight:700;letter-spacing:-.03em;margin:2px 0 14px}
.row{display:flex;gap:10px}
.stat{flex:1;padding:12px 14px;border-radius:18px;background:rgba(255,255,255,.06);border:1px solid var(--edge)}
.stat b{display:block;font-size:20px}.stat span{color:var(--muted);font-size:12px}
.item{display:flex;align-items:center;gap:12px;padding:16px;margin-bottom:10px;cursor:pointer;transition:transform .15s}
.item:active{transform:scale(.98)}
.item .t{flex:1;min-width:0}.item .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .t span{color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pill{padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;white-space:nowrap}
.pill.soft{background:rgba(255,255,255,.1);color:var(--text)}
.btn{width:100%;border:0;border-radius:18px;padding:14px;font:600 16px inherit;color:#fff;cursor:pointer;
  background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:rgba(255,255,255,.1);color:var(--text);box-shadow:inset 0 1px 0 var(--hi)}
input{width:100%;padding:14px 16px;border-radius:16px;border:1px solid var(--edge);background:rgba(255,255,255,.06);color:var(--text);font:16px inherit;outline:0;margin-bottom:10px}
input:focus{border-color:var(--accent)}
.msg{font-size:14px;margin:0 4px 10px;min-height:20px}.ok{color:var(--ok)}.err{color:var(--err)}
.empty{text-align:center;color:var(--muted);padding:40px 0}
nav{position:fixed;z-index:5;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);
  display:flex;gap:4px;padding:6px;border-radius:999px;width:min(92vw,380px)}
nav button{flex:1;border:0;background:none;color:var(--muted);padding:10px 0;border-radius:999px;font:600 13px inherit;cursor:pointer;transition:.2s}
nav button.on{color:var(--text);background:rgba(255,255,255,.16);box-shadow:inset 0 1px 0 var(--hi)}
.view{display:none;animation:in .3s ease}.view.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ring{position:relative;width:min(70vw,260px);aspect-ratio:1;margin:4px auto 16px}
.ring svg{width:100%;height:100%;overflow:visible}
.trk{fill:none;stroke:rgba(255,255,255,.1);stroke-width:14}
.arc{fill:none;stroke:var(--ok);stroke-width:14;transition:stroke-dasharray .4s;filter:drop-shadow(0 0 8px var(--ok))}
#ptr line{stroke:var(--text);stroke-width:3;stroke-linecap:round}#ptr circle{fill:var(--text);filter:drop-shadow(0 0 6px var(--text))}
.mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.mid b{font-size:40px;letter-spacing:-.03em}.mid span{color:var(--muted);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{flex:1;min-width:52px;padding:10px 0;text-align:center;border-radius:14px;font-weight:600;font-size:14px;cursor:pointer;background:rgba(255,255,255,.07);border:1px solid var(--edge);transition:.15s}
.chip.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent}
.res{text-align:center;padding:16px;border-radius:20px;margin-top:12px;font-size:22px;font-weight:700;animation:in .3s}
.res.win{background:rgba(110,231,183,.14);color:var(--ok)}.res.lose{background:rgba(255,138,155,.12);color:var(--err)}
.res small{display:block;font-size:13px;font-weight:500;opacity:.8}
.res.gold{background:rgba(255,207,92,.15);color:#ffcf5c;font-size:17px}.res.gold .btn{margin-top:10px}
.btn:disabled{opacity:.5}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;margin:4px 0 8px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .6s}
.li{display:flex;justify-content:space-between;align-items:center;padding:10px 4px;border-bottom:1px solid var(--edge)}
.li:last-child{border:0}.li.me{color:var(--accent);font-weight:700}
</style>
</head>
<body>
<div class="blob a"></div><div class="blob b"></div><div class="blob c"></div>
<main>
  <section id="home" class="view on">
    <h1 id="hi">Привет</h1>
    <div class="glass hero card">
      <small>Баланс</small>
      <div class="big"><span id="coins">0</span> <small>монет</small></div>
      <div class="row">
        <div class="stat"><b id="friends">0</b><span>друзей</span></div>
        <div class="stat"><b id="dl">0</b><span>скачано</span></div>
      </div>
    </div>
    <h2>Промокод</h2>
    <div class="glass card">
      <input id="code" placeholder="Введи промокод" autocapitalize="characters">
      <div id="pmsg" class="msg"></div>
      <button class="btn" id="redeem">Активировать</button>
    </div>
    <h2>Друзья</h2>
    <div class="glass card">
      <div class="bar"><i id="bar"></i></div>
      <div id="btxt" style="color:var(--muted);margin-bottom:12px">Пригласи 5 друзей — получи партнёрскую сборку.</div>
      <button class="btn" id="share">Пригласить</button>
      <button class="btn ghost" id="copy" style="margin-top:8px">Скопировать ссылку</button>
    </div>
    <h2>Топ по монетам</h2>
    <div class="glass card" id="top"></div>
  </section>

  <section id="builds" class="view"><h1>Сборки</h1><div id="blist"></div></section>

  <section id="bonus" class="view">
    <h1>Бонусы</h1>
    <h2>Задания</h2><div id="tlist"></div>
    <h2>Магазин</h2><div id="slist"></div>
  </section>

  <section id="up" class="view">
    <h1>Апгрейд</h1>
    <div class="glass card">
      <div class="ring">
        <svg viewBox="0 0 220 220">
          <circle class="trk" cx="110" cy="110" r="94"/>
          <circle id="arc" class="arc" cx="110" cy="110" r="94" transform="rotate(-90 110 110)" stroke-dasharray="0 600"/>
          <g id="ptr" style="transform-origin:110px 110px"><line x1="110" y1="2" x2="110" y2="24"/><circle cx="110" cy="2" r="5"/></g>
        </svg>
        <div class="mid"><b id="uch">–</b><span id="umul">шанс</span></div>
      </div>
      <div class="row">
        <div class="stat"><span>Ставка</span><b id="ubet">0</b></div>
        <div class="stat"><span>Выигрыш</span><b id="upay">0</b></div>
      </div>
      <div id="ures"></div>
    </div>
    <div class="glass card">
      <input id="ubin" type="number" inputmode="numeric" placeholder="Сумма ставки">
      <div class="chips" id="qchips"></div>
      <div class="chips" id="mchips"></div>
      <div id="umsg" class="msg"></div>
      <button class="btn" id="spin">Апгрейд</button>
      <div id="uprize" class="msg" style="margin-top:10px;color:var(--muted)"></div>
    </div>
    <h2>Твоя статистика</h2>
    <div class="glass card" id="uhist"></div>
  </section>
</main>

<nav class="glass">
  <button class="on" data-v="home">Главная</button>
  <button data-v="builds">Сборки</button>
  <button data-v="bonus">Бонусы</button>
  <button data-v="up">Апгрейд</button>
</nav>

<script>
// ВПИШИ адрес, где запущен бот (https, без слэша в конце)
// Адрес бота берётся из ссылки (?api=...), которую бот сам выставляет в кнопке меню; запасной — ниже
const _q = new URLSearchParams(location.search).get("api");
const API = (_q && /^https:\/\/[\w.-]+$/.test(_q)) ? _q : "https://worker-production-6393.up.railway.app";

const tg = window.Telegram?.WebApp;
tg?.ready(); tg?.expand();
tg?.setHeaderColor?.("secondary_bg_color");
let ME = null;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hap = t => tg?.HapticFeedback?.impactOccurred?.(t || "light");

async function api(path, body) {
  const r = await fetch(API + path, {
    method: body ? "POST" : "GET",
    headers: {"X-Init-Data": tg?.initData || "", "Content-Type": "application/json"},
    body: body ? JSON.stringify(body) : undefined
  });
  if (!r.ok) throw new Error(r.status);
  return r.json();
}
const toBot = param => {
  const url = `https://t.me/${ME.bot}` + (param ? `?start=${param}` : "");
  tg ? tg.openTelegramLink(url) : window.open(url, "_blank");
};

document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  hap();
  document.querySelectorAll("nav button,.view").forEach(e => e.classList.remove("on"));
  b.classList.add("on"); $(b.dataset.v).classList.add("on");
});

const empty = t => `<div class="empty">${t}</div>`;

async function init() {
  if (!tg?.initData) { document.body.innerHTML = `<main><div class="empty">Открой приложение из Telegram</div></main>`; return; }
  try {
    ME = await api("/api/me");
    const name = tg.initDataUnsafe?.user?.first_name || "";
    $("hi").textContent = name ? `Привет, ${name}` : "Привет";
    $("coins").textContent = ME.coins; $("friends").textContent = ME.friends; $("dl").textContent = ME.downloaded;
    loadUp().catch(() => { $("umsg").innerHTML = `<span class="err">Бот не отвечает на /api/upgrade. Залей новый main.py на Railway.</span>`; });
    $("bar").style.width = Math.min(100, ME.friends / 5 * 100) + "%";
    $("btxt").textContent = ME.friends >= 5 ? "Цель выполнена: проверь награду в боте" : `Приглашено ${ME.friends} из 5: получи партнёрскую сборку`;
    api("/api/top").then(r => {
      $("top").innerHTML = r.top.length ? r.top.map(x => `<div class="li${x.me ? " me" : ""}"><span>${x.n}. ${x.name}${x.me ? " (ты)" : ""}</span><b>${x.coins}</b></div>`).join("")
        + (r.rank && !r.top.some(x => x.me) ? `<div class="li me"><span>Твоё место: ${r.rank}</span></div>` : "") : empty("Пока никого");
    }).catch(() => {});
    if (!ME.registered) $("pmsg").innerHTML = `<span class="err">Сначала нажми /start в боте</span>`;

    const [b, t, s] = await Promise.all([api("/api/builds"), api("/api/tasks"), api("/api/shop")]);
    $("blist").innerHTML = b.length ? b.map(x => `
      <div class="glass item" data-b="${x.id}"><div class="t"><b>${x.recommended ? "⭐ " : ""}${esc(x.name)}</b>
      <span>${esc(x.description) || "Скачиваний: " + x.downloads}</span></div><div class="pill">Скачать</div></div>`).join("")
      : empty("Сборок пока нет");
    $("blist").querySelectorAll("[data-b]").forEach(e => e.onclick = () => { hap("medium"); toBot("build_" + e.dataset.b); });

    $("tlist").innerHTML = t.length ? t.map(x => `
      <div class="glass item" data-go="task_${x.id}"><div class="t"><b>${esc(x.title)}</b><span>${esc(x.description)}</span></div>
      <div class="pill">+${x.reward}</div></div>`).join("") : empty("Заданий пока нет");
    $("slist").innerHTML = s.length ? s.map(x => `
      <div class="glass item" data-go="shop_${x.id}"><div class="t"><b>${esc(x.name)}</b><span>${esc(x.description)}</span></div>
      <div class="pill soft">${x.price} монет</div></div>`).join("") : empty("Товаров пока нет");
    document.querySelectorAll("[data-go]").forEach(e => e.onclick = () => { hap(); toBot(e.dataset.go); });
  } catch (e) {
    document.querySelector("main").insertAdjacentHTML("afterbegin", `<div class="msg err">Не удалось загрузить данные. Попробуй позже.</div>`);
  }
}

// ---- Апгрейдер ----
let UP = null, um = 2, spinning = false;
const RC = 2 * Math.PI * 94;
const umsg = t => $("umsg").innerHTML = t ? `<span class="err">${esc(t)}</span>` : "";
function upCalc() {
  const m = UP.mults.find(x => x.m === um), bet = Math.max(0, Math.floor(+$("ubin").value || 0));
  $("uch").textContent = m.chance + "%"; $("umul").textContent = "x" + um;
  $("ubet").textContent = bet; $("upay").textContent = Math.floor(bet * um);
  $("arc").style.strokeDasharray = `${m.chance / 100 * RC} ${RC}`;
  document.querySelectorAll("#mchips .chip").forEach(c => c.classList.toggle("on", +c.dataset.m === um));
}
async function loadUp() {
  UP = await api("/api/upgrade/config");
  $("mchips").innerHTML = UP.mults.map(x => `<div class="chip" data-m="${x.m}">x${x.m}</div>`).join("");
  $("qchips").innerHTML = ["10", "50", "100", "½", "×2", "MAX"].map(x => `<div class="chip" data-q="${x}">${x}</div>`).join("");
  $("mchips").onclick = e => { const c = e.target.closest(".chip"); if (c && !spinning) { um = +c.dataset.m; hap(); upCalc(); } };
  $("qchips").onclick = e => {
    const c = e.target.closest(".chip"); if (!c || spinning) return; hap();
    const q = c.dataset.q, v = Math.floor(+$("ubin").value || 0);
    $("ubin").value = q === "½" ? Math.max(UP.min, Math.floor(v / 2)) : q === "×2" ? Math.min(UP.max, v * 2)
      : q === "MAX" ? Math.min(UP.max, UP.coins) : +q;
    upCalc();
  };
  $("ubin").oninput = upCalc;
  $("uprize").textContent = (UP.prize ? `🎁 Шанс ${UP.prize.chance}% выиграть доступ «${UP.prize.name}» при выигрыше (ставка от ${UP.prize.min_bet}). ` : "") + `Игр сегодня осталось: ${UP.left}`;
  const st = UP.stats;
  $("uhist").innerHTML = st.spins
    ? `<div class="row" style="margin-bottom:10px"><div class="stat"><b>${st.wins} / ${st.spins}</b><span>побед</span></div><div class="stat"><b>+${st.best}</b><span>лучший выигрыш</span></div></div>`
      + UP.history.map(x => `<div class="li"><span>x${x.mult} · ставка ${x.bet}</span><b class="${x.win ? "ok" : "err"}">${x.win ? "+" + (x.payout - x.bet) : "−" + x.bet}</b></div>`).join("")
    : empty("Игр пока нет");
  upCalc();
}
$("spin").onclick = async () => {
  if (spinning || !UP) return;
  const bet = Math.floor(+$("ubin").value || 0);
  if (bet < UP.min || bet > UP.max) return umsg(`Ставка: от ${UP.min} до ${UP.max}`);
  if (bet > UP.coins) return umsg("Недостаточно монет");
  umsg(""); spinning = true; $("spin").disabled = true; $("ures").innerHTML = "";
  try {
    const r = await api("/api/upgrade", {bet, mult: um});
    if (!r.ok) { umsg(r.error); return; }
    const p = $("ptr");
    p.style.transition = "none"; p.style.transform = "rotate(0deg)"; p.getBoundingClientRect();
    p.style.transition = "transform 4s cubic-bezier(.12,.6,.1,1)";
    p.style.transform = `rotate(${360 * 5 + r.roll / 100 * 360}deg)`;
    const t = setInterval(() => hap("light"), 250);
    await new Promise(s => setTimeout(s, 4100)); clearInterval(t);
    UP.coins = r.balance; $("coins").textContent = r.balance;
    tg?.HapticFeedback?.notificationOccurred?.(r.win ? "success" : "error");
    let html = r.win
      ? `<div class="res win">+${r.payout - r.bet} монет<small>${r.bet} → ${r.payout} (x${r.mult})</small></div>`
      : `<div class="res lose">−${r.bet} монет<small>Не повезло, шанс был ${r.chance}%</small></div>`;
    if (r.prize) html += `<div class="res gold">🎁 Ты выиграл доступ!<br>«${esc(r.prize.name)}»<button class="btn" id="join">Вступить</button></div>`;
    $("ures").innerHTML = html;
    if (r.prize) $("join").onclick = () => tg.openTelegramLink(r.prize.link);
    loadUp();
  } catch { umsg("Ошибка сети"); }
  finally { spinning = false; $("spin").disabled = false; }
};

$("redeem").onclick = async () => {
  const code = $("code").value.trim(); if (!code) return;
  try {
    const r = await api("/api/promo", {code});
    $("pmsg").innerHTML = r.ok ? `<span class="ok">Начислено ${r.coins} монет</span>` : `<span class="err">${esc(r.error)}</span>`;
    if (r.ok) { $("coins").textContent = +$("coins").textContent + r.coins; $("code").value = ""; hap("medium"); }
  } catch { $("pmsg").innerHTML = `<span class="err">Ошибка сети</span>`; }
};
$("share").onclick = () => {
  const u = `https://t.me/share/url?url=${encodeURIComponent(ME.ref_link)}&text=${encodeURIComponent("Заходи за сборками!")}`;
  tg.openTelegramLink(u);
};
$("copy").onclick = async () => {
  try { await navigator.clipboard.writeText(ME.ref_link); $("copy").textContent = "Скопировано ✓"; setTimeout(() => $("copy").textContent = "Скопировать ссылку", 1500); } catch {}
};
init();
</script>
</body>
</html>
